// Shattered Life crash isolation test. Run from the console in a loaded map:  exec sl_crashtest
// Writes everything to sl_crashtest.log in the mod folder. The last "SLTEST" line before the
// game dies tells us which weapon / step crashed.
con_logfile sl_crashtest.log
developer 1
sv_cheats 1
echo "SLTEST begin"
echo "SLTEST step crowbar give"; give weapon_crowbar; wait 60
echo "SLTEST step crowbar draw"; use weapon_crowbar; wait 200
echo "SLTEST step deagle give"; give weapon_deagle; wait 60
echo "SLTEST step deagle draw"; use weapon_deagle; wait 200
echo "SLTEST step organic_rifle give"; give weapon_organic_rifle; wait 60
echo "SLTEST step organic_rifle draw"; use weapon_organic_rifle; wait 200
echo "SLTEST step aperture_gl give"; give weapon_aperture_gl; wait 60
echo "SLTEST step aperture_gl draw"; use weapon_aperture_gl; wait 200
echo "SLTEST step barnacle give"; give weapon_barnacle; wait 60
echo "SLTEST step barnacle draw"; use weapon_barnacle; wait 200
echo "SLTEST step wrench give"; give weapon_wrench; wait 60
echo "SLTEST step wrench draw"; use weapon_wrench; wait 200
echo "SLTEST step wrench swing"; +attack; wait 10; -attack; wait 120
echo "SLTEST all steps passed"
